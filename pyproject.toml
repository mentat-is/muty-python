[build-system]
requires = ["setuptools>=60", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "muty"
dynamic = ["version"]
authors = [{ name = "Mentat", email = "info@mentat.is" }]
description = "our internal utilities :)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiofiles==24.1.0",
    "aiohttp==3.11.8",
    "aiomultiprocess==0.9.1",
    "aiopath==0.7.7",
    "aioshutil==1.5",
    "art==6.2",
    "async-unzip==0.3.6",
    "coloredlogs==15.0.1",
    "fastapi==0.115.5",
    "json5==0.9.25",
    "lxml==5.3.0",
    "ntplib==0.4.0",
    "psutil==6.0.0",
    "pycryptodome==3.20.0",
    "pydantic==2.9.2",
    "python-dateutil==2.9.0.post0",
    "setuptools==75.1.0",
    "starlette==0.41.2",
    "xmltodict==0.13.0",
    "xxhash==3.5.0"
]
